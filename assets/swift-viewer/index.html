<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SWIFT · 实时粒子 Viewer</title><link rel="stylesheet" href="viewer.css?rev=clean"><body>
<header><a href="../blender/index.html">← SWIFT 展示</a><strong>SWIFT / LIVE PARTICLES</strong></header>
<main><canvas id="view" tabindex="0" aria-label="实时三维粒子：拖动旋转，Shift 拖动平移，滚轮缩放"></canvas>
<aside><h1>宇宙结构演化</h1><p class="caption">100k 固定抽样粒子 · 57 个快照</p><output id="time">正在加载…</output>
<label>时间轴 · a 等速<input id="timeline" type="range" min="0.004975" max="1" step="any" value="1"></label>
<div class="transport"><button id="play">播放</button><button id="reset">重置视角</button></div>
<label>配色<select id="color"><option value="0">统一冷白</option><option value="1">Speed · 0–1000 km/s</option></select></label>
<label><input id="box" type="checkbox" checked> 显示盒边界</label>
<button id="preload">完整预载 · 91 MB</button>
<p id="status" role="status">初始化…</p><p id="error" role="alert" hidden></p>
<p class="hint">拖动旋转 · 滚轮缩放<br>Shift 拖动平移</p>
</aside></main><script src="viewer.js?rev=clean"></script></body></html>
